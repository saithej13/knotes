<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #000;
            padding: 4px;
            text-align: center;
            font-size: 11px;
        }
        th.fat-header {
            background-color: #f2f2f2;
        }
        td.snf-header {
            font-weight: bold;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h2>Rate Chart</h2>

<table>
    <thead>
    <tr>
        <th>SNF \ FAT</th>
        {{#each fatHeaders}}
        <th class="fat-header">{{this}}</th>
        {{/each}}
    </tr>
    </thead>
    <tbody>
    {{#each snfRows}}
    <tr>
        <td class="snf-header">{{snf}}</td>
        {{#each fatValues}}
        <td>{{this}}</td>
        {{/each}}
    </tr>
    {{/each}}
    </tbody>
</table>

</body>
</html>
